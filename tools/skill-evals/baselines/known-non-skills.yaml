# Backticked kebab-case names that are legitimately NOT skills (SK050, SK052).
#
# The corpus name-drops tools, agents, repos, and HTML attributes in backticks. Without
# this allowlist the cross-reference rules are pure noise; with it they are precise.

allow:
  # Sibling repositories
  - edge-ai-robotics-automation-toolkit
  - grounded-code-mcp

  # Read-only research subagents (agents, not skills)
  - research-file-locator
  - research-code-analyzer
  - research-pattern-finder

  # External tooling invoked by skills
  - cargo-audit
  - cargo-deny
  - cargo-semver-checks
  - pip-audit
  - npm-audit
  - import-linter
  - php-cs-fixer
  - eslint-plugin-security
  - eslint-plugin-jsx-a11y
  - vue-tsc

  # Framework/markup identifiers that happen to be kebab-case
  - v-html
  - script-setup
  - data-testid
  - aria-label
  - aria-live
  - prefers-color-scheme
